<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense-Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1> Expense Tracker</h1>

    <div class="balance">
      <h3>Your Balance</h3>
      <h2 id="balance">0.00XAF</h2>
    </div>

    <div class="summary">
      <div>
        <h4>Income</h4>
        <p id="income" class="money plus">+0.00XAF</p>
      </div>
      <div>
        <h4>Expenses</h4>
        <p id="expense" class="money minus">-0.00XAF</p>
      </div>
    </div>

    <h3>Add Transaction</h3>
    <form id="form">
      <input type="text" id="text" placeholder="Description" required />
      <input type="number" id="amount" placeholder="Amount (+/-)" required />
      <input type="date" id="date" />
      <button>Add</button>
    </form>

    <h3>History</h3>
    <ul id="list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
